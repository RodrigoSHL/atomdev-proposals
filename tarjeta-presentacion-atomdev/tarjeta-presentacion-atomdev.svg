<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tarjeta de presentación de AtomDev</title>
  <desc id="desc">AtomDev, desarrollo y soluciones digitales. WhatsApp 569 93611880, correo shl.catalan@gmail.com y sitio web www.atomdev.cl.</desc>

  <defs>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45474A"/>
      <stop offset="1" stop-color="#343638"/>
