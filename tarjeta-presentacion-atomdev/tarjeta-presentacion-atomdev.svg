      <ellipse cx="116" cy="116" rx="38" ry="96" fill="none" stroke="#F7F8F8" stroke-opacity=".88" stroke-width="7" transform="rotate(52 116 116)"/>
      <ellipse cx="116" cy="116" rx="38" ry="96" fill="none" stroke="#F7F8F8" stroke-opacity=".88" stroke-width="7" transform="rotate(-52 116 116)"/>
      <circle cx="116" cy="116" r="26" fill="url(#tealGlow)"/>
      <circle cx="143" cy="43" r="13" fill="#08AABD"/>
