    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#172027" flood-opacity=".18"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="18" y="18" width="1764" height="964" rx="28"/>
    </clipPath>
  </defs>

  <rect x="18" y="18" width="1764" height="964" rx="28" fill="#FFFFFF" filter="url(#softShadow)"/>
